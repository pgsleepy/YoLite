[package]
name = "yolite"
version = "0.1.2"
description = "A lightweight YouTube Music client."
authors = ["Yolite"]
edition = "2024"

[lib]
name = "yolite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
dirs = "6.0.0"
discord-rich-presence = "1.1.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "gzip", "rustls-tls"] }
ring = "0.17.14"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "=2.11.5", features = ["image-png"] }
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-updater = "2.11.0"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["sync"] }
